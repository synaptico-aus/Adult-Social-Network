openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Authenticated account lifecycle
  - name: safety
    description: Member safety and reporting
  - name: staff
    description: Capability-scoped moderation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /account/onboarding:
    post:
      operationId: completeOnboarding
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummary"
        "400": { description: Invalid or ineligible onboarding }
        "401": { description: Unauthorized }
  /account:
    get:
      operationId: getAccountSummary
      tags: [account]
      responses:
        "200":
          description: Account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummary"
        "401": { description: Unauthorized }
  /account/sessions:
    get:
      operationId: listAccountSessions
      tags: [account]
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountSession" }
        "401": { description: Unauthorized }
  /account/sessions/{sessionId}:
    delete:
      operationId: revokeAccountSession
      tags: [account]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        "401": { description: Unauthorized }
        "403": { description: Not owned by current member }
  /account/sessions/others:
    delete:
      operationId: revokeOtherAccountSessions
      tags: [account]
      responses:
        "204": { description: Revoked }
        "401": { description: Unauthorized }
  /account/deletion:
    get:
      operationId: getDeletionStatus
      tags: [account]
      responses:
        "200":
          description: Deletion status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionStatus" }
        "401": { description: Unauthorized }
    post:
      operationId: initiateDeletion
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeletionInput" }
      responses:
        "202":
          description: Pending manual/worker processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionStatus" }
        "401": { description: Unauthorized }
        "403": { description: Fresh Clerk reauthentication required }
    delete:
      operationId: cancelDeletion
      tags: [account]
      responses:
        "204": { description: Cancelled }
        "401": { description: Unauthorized }
  /profile:
    get:
      operationId: getOwnProfile
      tags: [profile]
      responses:
        "200": { description: Own profile, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
    put:
      operationId: updateOwnProfile
      tags: [profile]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfileInput" } } }
      responses:
        "200": { description: Updated profile, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
  /profile/view-as-member:
    get:
      operationId: previewProfileAsMember
      tags: [profile]
      responses:
        "200": { description: Visibility-filtered preview, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
  /privacy:
    patch:
      operationId: updatePrivacySettings
      tags: [privacy]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PrivacySettings" } } }
      responses:
        "200": { description: Privacy settings }
  /this-is-me:
    get:
      operationId: listThisIsMeCards
      tags: [profile]
      responses:
        "200": { description: Cards, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ThisIsMeCard" } } } } }
    post:
      operationId: createThisIsMeCard
      tags: [profile]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ThisIsMeCardInput" } } }
      responses:
        "201": { description: Created card, content: { application/json: { schema: { $ref: "#/components/schemas/ThisIsMeCard" } } } }
  /this-is-me/{id}:
    patch:
      operationId: updateThisIsMeCard
      tags: [profile]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ThisIsMeCardUpdate" } } }
      responses: { "200": { description: Updated card } }
    delete:
      operationId: deleteThisIsMeCard
      tags: [profile]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted } }
  /verification:
    get:
      operationId: getOwnVerificationRequests
      tags: [verification]
      responses: { "200": { description: Verification requests } }
    post:
      operationId: submitVerificationRequest
      tags: [verification]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VerificationRequestInput" } } }
      responses: { "201": { description: Submitted } }
  /consent:
    get:
      operationId: getConsentHistory
      tags: [consent]
      responses: { "200": { description: Append-only consent history } }
  /profile/export:
    get:
      operationId: exportOwnProfile
      tags: [profile]
      responses: { "200": { description: Authenticated JSON export } }
  /profile/photo/upload-url:
    post:
      operationId: requestProfilePhotoUpload
      tags: [profile]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePhotoUploadInput" } } }
      responses: { "200": { description: Private upload URL, content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePhotoUpload" } } } } }
  /profile/photo/{memberId}/{photoId}:
    get:
      operationId: serveProfilePhoto
      tags: [profile]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string } }
        - { name: photoId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Private image bytes } }
  /staff/verification-requests:
    get:
      operationId: listVerificationRequestsForStaff
      tags: [verification]
      responses: { "200": { description: Staff-only verification queue, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/VerificationRequest" } } } } } }
  /staff/verification-requests/{id}:
    patch:
      operationId: reviewVerificationRequest
      tags: [verification]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VerificationReviewInput" } } }
      responses: { "200": { description: Reviewed request, content: { application/json: { schema: { $ref: "#/components/schemas/VerificationRequest" } } } } }
  /staff/tools:
    get:
      operationId: getStaffCapabilitySummary
      tags: [staff]
      responses: { "200": { description: Staff capability summary, content: { application/json: { schema: { $ref: "#/components/schemas/StaffCapabilitySummary" } } } } }
  /staff/capabilities:
    get:
      operationId: getStaffCapabilities
      tags: [staff]
      responses:
        "200":
          description: Server-authorized staff capabilities and tools
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffCapabilities" } } }
        "401": { description: Unauthorized }
        "403": { description: Active staff assignment required }
  /safety/{kind}:
    post:
      operationId: createSafetyRelationship
      tags: [safety]
      parameters: [{ name: kind, in: path, required: true, schema: { type: string, enum: [block, mute, restrict] } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SafetyRelationshipInput" } } }
      responses: { "201": { description: Relationship created, content: { application/json: { schema: { $ref: "#/components/schemas/SafetyRelationship" } } } }, "401": { description: Unauthorized } }
  /safety/{kind}/{targetMemberId}:
    delete:
      operationId: deleteSafetyRelationship
      tags: [safety]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [block, mute, restrict] } }
        - { name: targetMemberId, in: path, required: true, schema: { type: string } }
      responses: { "204": { description: Removed }, "401": { description: Unauthorized } }
  /safety/relationships:
    get:
      operationId: listOwnSafetyRelationships
      tags: [safety]
      responses:
        "200":
          description: Safety relationships owned by the signed-in member
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SafetyRelationship" } } } }
        "401": { description: Unauthorized }
  /reports:
    get:
      operationId: listOwnReports
      tags: [safety]
      responses: { "200": { description: Own report history, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ReportHistoryItem" } } } } } }
    post:
      operationId: createReport
      tags: [safety]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReportInput" } } }
      responses: { "201": { description: Report created, content: { application/json: { schema: { $ref: "#/components/schemas/ReportCreateResponse" } } } } }
  /appeals:
    get:
      operationId: listOwnAppeals
      tags: [safety]
      responses: { "200": { description: Own appeals, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Appeal" } } } } } }
    post:
      operationId: createAppeal
      tags: [safety]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AppealInput" } } }
      responses: { "201": { description: Appeal created, content: { application/json: { schema: { $ref: "#/components/schemas/Appeal" } } } } }
  /support-contact:
    get:
      operationId: getSupportContact
      tags: [safety]
      responses: { "200": { description: Published support contact, content: { application/json: { schema: { $ref: "#/components/schemas/SupportContact" } } } }, "503": { description: Not configured } }
  /staff/moderation/queue:
    get:
      operationId: getModerationQueue
      tags: [staff]
      responses: { "200": { description: Capability-scoped moderation queue, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/QueueItem" } } } } } }
  /staff/moderation/urgent:
    get:
      operationId: getUrgentModerationQueue
      tags: [staff]
      responses: { "200": { description: Urgent queue, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/QueueItem" } } } } } }
  /staff/evidence/{evidenceId}/access:
    post:
      operationId: accessReportedEvidence
      tags: [staff]
      parameters: [{ name: evidenceId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceAccessInput" } } } }
      responses: { "200": { description: Scoped reported evidence, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceAccessResponse" } } } } }
  /staff/moderation/{id}/decision:
    post:
      operationId: decideModeration
      tags: [staff]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModerationDecisionInput" } } }
      responses: { "200": { description: Moderation decision, content: { application/json: { schema: { $ref: "#/components/schemas/ModerationRecord" } } } } }
  /staff/appeals:
    get:
      operationId: listStaffAppeals
      tags: [staff]
      responses: { "200": { description: Pending appeals, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Appeal" } } } } } }
  /staff/appeals/{id}:
    patch:
      operationId: reviewStaffAppeal
      tags: [staff]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AppealReviewInput" } } } }
      responses: { "200": { description: Reviewed appeal, content: { application/json: { schema: { $ref: "#/components/schemas/Appeal" } } } } }
  /friends/requests:
    get:
      operationId: listFriendRequests
      tags: [friends]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
      responses: { "200": { description: Incoming and outgoing requests, content: { application/json: { schema: { $ref: "#/components/schemas/FriendRequestLists" } } } } }
    post:
      operationId: sendFriendRequest
      tags: [friends]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MemberTargetInput" } } } }
      responses: { "201": { description: Request created, content: { application/json: { schema: { $ref: "#/components/schemas/FriendRequestMutationResponse" } } } }, "200": { description: Existing reciprocal request, content: { application/json: { schema: { $ref: "#/components/schemas/FriendRequestMutationResponse" } } } } }
  /friends/requests/{requestId}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Friendship } }
  /friends/requests/{requestId}/decline:
    post:
      operationId: declineFriendRequest
      tags: [friends]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Declined } }
  /friends/requests/{requestId}:
    delete:
      operationId: cancelFriendRequest
      tags: [friends]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Cancelled } }
  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
      responses: { "200": { description: Friendships, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedFriends" } } } } }
  /friends/{memberId}:
    delete:
      operationId: unfriend
      tags: [friends]
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Removed } }
  /follows/{memberId}:
    post:
      operationId: followMember
      tags: [follows]
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      responses: { "201": { description: Follow created } }
    delete:
      operationId: unfollowMember
      tags: [follows]
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Removed } }
  /follows:
    get:
      operationId: listFollows
      tags: [follows]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
      responses: { "200": { description: Follows, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedFollows" } } } } }
  /search:
    get:
      operationId: searchProfiles
      tags: [discovery]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses: { "200": { description: Discoverable profiles, content: { application/json: { schema: { $ref: "#/components/schemas/SearchResponse" } } } } }
  /discovery/suggestions:
    get:
      operationId: listSuggestions
      tags: [discovery]
      responses: { "200": { description: Explicitly opted-in suggestions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Suggestion" } } } } } }
  /discovery/suggestions/{memberId}/hide:
    post:
      operationId: hideSuggestion
      tags: [discovery]
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Hidden } }
  /account/settings:
    get:
      operationId: getAccountSettings
      tags: [account]
      responses: { "200": { description: Relationship and discovery settings, content: { application/json: { schema: { $ref: "#/components/schemas/AccountSettings" } } } } }
    patch:
      operationId: updateAccountSettings
      tags: [account]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AccountSettingsInput" } } } }
      responses: { "200": { description: Updated settings, content: { application/json: { schema: { $ref: "#/components/schemas/AccountSettings" } } } } }
  /posts:
    get:
      operationId: listOwnPosts
      tags: [posts]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: authorMemberId, in: query, schema: { type: string } }
      responses: { "200": { description: Posts, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedPosts" } } } } }
    post:
      operationId: createPost
      tags: [posts]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PostInput" } } } }
      responses: { "201": { description: Created post, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } } }
  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Post detail, content: { application/json: { schema: { $ref: "#/components/schemas/Post" } } } }
        "404": { description: Post not found }
    patch:
      operationId: updatePost
      tags: [posts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PostInput" } } } }
      responses: { "200": { description: Updated post } }
    delete:
      operationId: deletePost
      tags: [posts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted } }
  /posts/{id}/publish:
    post:
      operationId: publishPost
      tags: [posts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Published post } }
  /feed:
    get:
      operationId: getFeed
      tags: [posts]
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, friends], default: all } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { "200": { description: Reverse chronological feed, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedPosts" } } } } }
  /notifications:
    get:
      operationId: listNotificationEvents
      tags: [notifications]
      responses: { "200": { description: Reauthorized internal notification events, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /posts/{id}/reactions:
    post:
      operationId: togglePostReaction
      tags: [posts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReactionInput" } } } }
      responses: { "200": { description: Reaction state } }
  /posts/{id}/comments:
    get:
      operationId: listPostComments
      tags: [posts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Comments, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Comment" } } } } } }
    post:
      operationId: createPostComment
      tags: [posts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommentInput" } } } }
      responses: { "201": { description: Comment, content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } } }
  /comments/{id}:
    patch:
      operationId: updatePostComment
      tags: [posts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommentUpdateInput" } } } }
      responses: { "200": { description: Updated comment } }
    delete:
      operationId: deletePostComment
      tags: [posts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted } }
  /posts/{id}/save:
    post:
      operationId: savePost
      tags: [posts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Saved } }
    delete:
      operationId: unsavePost
      tags: [posts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Unsaved } }
  /posts/{id}/hide:
    post:
      operationId: hidePost
      tags: [posts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Hidden } }
    delete:
      operationId: unhidePost
      tags: [posts]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Unhidden } }
  /saved:
    get:
      operationId: listSavedPosts
      tags: [posts]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { "200": { description: Saved posts, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedPosts" } } } } }
  /circles:
    get:
      operationId: listCircles
      tags: [circles]
      responses: { "200": { description: Circles I belong to, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Circle" } } } } } }
    post:
      operationId: createCircle
      tags: [circles]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CircleInput" } } } }
      responses: { "201": { description: Created circle, content: { application/json: { schema: { $ref: "#/components/schemas/Circle" } } } } }
  /circles/{circleId}:
    get:
      operationId: getCircle
      tags: [circles]
      parameters: [{ name: circleId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Circle, content: { application/json: { schema: { $ref: "#/components/schemas/Circle" } } } } }
    delete:
      operationId: closeCircle
      tags: [circles]
      parameters: [{ name: circleId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Circle closed } }
  /circles/{circleId}/invitations:
    post:
      operationId: createCircleInvitation
      tags: [circles]
      parameters: [{ name: circleId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CircleInvitationInput" } } } }
      responses: { "201": { description: Invitation, content: { application/json: { schema: { $ref: "#/components/schemas/CircleInvitation" } } } } }
  /circle-invitations:
    get:
      operationId: listCircleInvitations
      tags: [circles]
      responses: { "200": { description: My pending invitations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CircleInvitation" } } } } } }
  /circle-invitations/{invitationId}/accept:
    post:
      operationId: acceptCircleInvitation
      tags: [circles]
      parameters: [{ name: invitationId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Joined circle, content: { application/json: { schema: { $ref: "#/components/schemas/Circle" } } } } }
  /circle-invitations/{invitationId}/decline:
    post:
      operationId: declineCircleInvitation
      tags: [circles]
      parameters: [{ name: invitationId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Invitation declined } }
  /circles/{circleId}/members/{memberId}:
    patch:
      operationId: updateCircleMember
      tags: [circles]
      parameters: [{ name: circleId, in: path, required: true, schema: { type: string } }, { name: memberId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CircleMemberRoleInput" } } } }
      responses: { "200": { description: Updated role, content: { application/json: { schema: { $ref: "#/components/schemas/CircleMember" } } } } }
    delete:
      operationId: removeCircleMember
      tags: [circles]
      parameters: [{ name: circleId, in: path, required: true, schema: { type: string } }, { name: memberId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Member removed } }
  /circles/{circleId}/history-access:
    post:
      operationId: grantCircleHistoryAccess
      tags: [circles]
      parameters: [{ name: circleId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CircleHistoryInput" } } } }
      responses: { "204": { description: History access granted } }
  /circles/{circleId}/history-access/{memberId}:
    delete:
      operationId: revokeCircleHistoryAccess
      tags: [circles]
      parameters: [{ name: circleId, in: path, required: true, schema: { type: string } }, { name: memberId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: History access revoked } }
  /circles/{circleId}/leave:
    post:
      operationId: leaveCircle
      tags: [circles]
      parameters: [{ name: circleId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Left circle } }
  /circles/{circleId}/posts:
    get:
      operationId: listCirclePosts
      tags: [circles]
      parameters: [{ name: circleId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Circle posts, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedPosts" } } } } }
  /media/uploads/request:
    post:
      operationId: requestMediaUpload
      tags: [media]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MediaUploadInput" } } }
      responses:
        "201": { description: Upload requested, content: { application/json: { schema: { $ref: "#/components/schemas/MediaUploadSession" } } } }
        "200": { description: Existing idempotent upload, content: { application/json: { schema: { $ref: "#/components/schemas/MediaUploadSession" } } } }
  /media/uploads/{id}/complete:
    post:
      operationId: completeMediaUpload
      tags: [media]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Validated quarantined media, content: { application/json: { schema: { $ref: "#/components/schemas/MediaAttachment" } } } } }
  /media/uploads/{id}/retry:
    post:
      operationId: retryMediaUpload
      tags: [media]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Retry upload, content: { application/json: { schema: { $ref: "#/components/schemas/MediaUploadSession" } } } } }
  /media/uploads/{id}/cancel:
    post:
      operationId: cancelMediaUpload
      tags: [media]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Cancelled } }
  /media/{id}:
    get:
      operationId: deliverMedia
      tags: [media]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Short-lived private media stream } }
    patch:
      operationId: updateMediaTranscript
      tags: [media]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MediaTranscriptInput" } } }
      responses: { "200": { description: Updated transcript, content: { application/json: { schema: { $ref: "#/components/schemas/MediaAttachment" } } } } }
components:
  schemas:
    MediaUploadInput:
      type: object
      required: [kind, contentType, size, clientIdempotencyKey]
      properties:
        kind: { type: string, enum: [photo, audio] }
        contentType: { type: string }
        size: { type: integer, minimum: 1 }
        clientIdempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        altText: { type: string, minLength: 1, maxLength: 1000 }
    MediaUploadSession:
      type: object
      required: [asset, uploadURL]
      properties:
        asset: { $ref: "#/components/schemas/MediaAttachment" }
        uploadURL: { type: ["string", "null"], format: uri }
    MediaTranscriptInput:
      type: object
      required: [transcript]
      properties: { transcript: { type: string, minLength: 1, maxLength: 100000 } }
    CircleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    CircleMember:
      type: object
      required: [memberId, preferredName, role, joinedAt, historyAccess]
      properties:
        memberId: { type: string }
        preferredName: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        joinedAt: { type: string, format: date-time }
        historyAccess: { type: boolean }
    Circle:
      type: object
      required: [id, ownerMemberId, name, description, status, createdAt, updatedAt, members, myRole, historyAccess]
      properties:
        id: { type: string }
        ownerMemberId: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        status: { type: string, enum: [active, closed] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        members: { type: array, items: { $ref: "#/components/schemas/CircleMember" } }
        myRole: { type: ["string", "null"], enum: [owner, admin, member, null] }
        historyAccess: { type: boolean }
    CircleInvitationInput:
      type: object
      required: [recipientMemberId, expiresAt]
      properties:
        recipientMemberId: { type: string }
        expiresAt: { type: string, format: date-time }
    CircleInvitation:
      type: object
      required: [id, circleId, recipientMemberId, invitedByMemberId, status, expiresAt, createdAt, circleName, inviterName]
      properties:
        id: { type: string }
        circleId: { type: string }
        recipientMemberId: { type: string }
        invitedByMemberId: { type: string }
        status: { type: string, enum: [pending, accepted, declined, revoked, expired] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        circleName: { type: string }
        inviterName: { type: string }
    CircleMemberRoleInput:
      type: object
      required: [role]
      properties: { role: { type: string, enum: [admin, member] } }
    CircleHistoryInput:
      type: object
      required: [memberId]
      properties: { memberId: { type: string } }
    PostInput:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 20000 }
        audience: { type: string, enum: [only_me, friends, my_circle, public] }
        circleId: { type: ["string", "null"] }
        responseLabel: { type: ["string", "null"], enum: [someone_to_listen, shared_experiences, practical_ideas, something_uplifting, null] }
        commentsOpen: { type: boolean }
        visibleReactionCounts: { type: boolean }
        originalPostId: { type: string }
        commentary: { type: string, maxLength: 10000 }
        mediaAssetIds: { type: array, maxItems: 10, items: { type: string } }
    Post:
      type: object
      required: [id, authorMemberId, body, audience, status, commentsOpen, visibleReactionCounts, createdAt, updatedAt]
      properties:
        id: { type: string }
        authorMemberId: { type: string }
        body: { type: ["string", "null"] }
        audience: { type: string, enum: [only_me, friends, my_circle, public] }
        circleId: { type: ["string", "null"] }
        responseLabel: { type: ["string", "null"] }
        status: { type: string, enum: [draft, published, deleted] }
        commentsOpen: { type: boolean }
        visibleReactionCounts: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        authorId: { type: string }
        authorDisplayName: { type: string }
        myReactions: { type: array, items: { type: string, enum: [hear_you, thank_you_for_sharing] } }
        saved: { type: boolean }
        reactionCounts: { type: ["object", "null"] }
        originalAvailable: { type: boolean }
        mediaAssets: { type: array, items: { $ref: "#/components/schemas/MediaAttachment" } }
    MediaAttachment:
      type: object
      required: [id, kind, contentType, byteSize, width, height, durationSeconds, status, malwareState, abuseState, altText, transcript, limitation]
      properties:
        id: { type: string }
        kind: { type: string, enum: [photo, audio] }
        contentType: { type: ["string", "null"] }
        byteSize: { type: ["integer", "null"] }
        width: { type: ["integer", "null"] }
        height: { type: ["integer", "null"] }
        durationSeconds: { type: ["integer", "null"] }
        status: { type: string, enum: [uploading, quarantined, held, ready, rejected, cancelled, cleanup_pending] }
        malwareState: { type: string, enum: [pending, allowed, blocked, unavailable, error] }
        abuseState: { type: string, enum: [pending, allowed, blocked, unavailable, error] }
        altText: { type: ["string", "null"] }
        transcript: { type: ["string", "null"] }
        limitation: { type: ["string", "null"] }
    PaginatedPosts:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Post" } }
        nextCursor: { type: ["string", "null"] }
    ReactionInput:
      type: object
      required: [kind]
      properties: { kind: { type: string, enum: [hear_you, thank_you_for_sharing] } }
    CommentInput:
      type: object
      required: [body]
      properties: { body: { type: string, maxLength: 10000 }, parentCommentId: { type: ["string", "null"] } }
    CommentUpdateInput:
      type: object
      required: [body]
      properties: { body: { type: string, maxLength: 10000 } }
    Comment:
      type: object
      required: [id, postId, authorMemberId, body, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        postId: { type: string }
        authorMemberId: { type: string }
        parentCommentId: { type: ["string", "null"] }
        body: { type: string }
        status: { type: string, enum: [active, deleted] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MemberTargetInput:
      type: object
      required: [targetMemberId]
      properties: { targetMemberId: { type: string, minLength: 1 } }
    Relationship:
      type: object
      properties: { id: { type: string }, createdAt: { type: string, format: date-time } }
    AccountSettingsInput:
      type: object
      properties:
        inboundFriendRequests: { type: boolean }
        inboundFollows: { type: boolean }
        suggestionsEnabled: { type: boolean }
    AccountSettings:
      type: object
      required: [memberId, inboundFriendRequests, inboundFollows, suggestionsEnabled]
      properties:
        memberId: { type: string }
        inboundFriendRequests: { type: boolean }
        inboundFollows: { type: boolean }
        suggestionsEnabled: { type: boolean }
    RelationshipProfile:
      type: object
      required: [id, preferredName]
      properties: { id: { type: string }, preferredName: { type: string } }
    FriendListItem:
      type: object
      required: [id, memberId, preferredName, direction, status, createdAt]
      properties:
        id: { type: string }
        memberId: { type: string }
        preferredName: { type: string }
        direction: { type: string, enum: [mutual] }
        status: { type: string, enum: [friends] }
        createdAt: { type: string, format: date-time }
    FollowListItem:
      type: object
      required: [id, memberId, preferredName, direction, status, createdAt]
      properties:
        id: { type: string }
        memberId: { type: string }
        preferredName: { type: string }
        direction: { type: string, enum: [incoming, outgoing] }
        status: { type: string, enum: [following] }
        createdAt: { type: string, format: date-time }
    FriendRequestMutationResponse:
      type: object
      required: [status, request]
      properties:
        status: { type: string, enum: [created, incoming_request] }
        request: { $ref: "#/components/schemas/FriendRequest" }
    FriendRequest:
      type: object
      required: [id, requesterMemberId, recipientMemberId, memberAId, memberBId, status, createdAt]
      properties:
        id: { type: string }
        requesterMemberId: { type: string }
        recipientMemberId: { type: string }
        memberAId: { type: string }
        memberBId: { type: string }
        status: { type: string, enum: [pending, declined] }
        createdAt: { type: string, format: date-time }
    FriendRequestItem:
      type: object
      required: [id, requesterMemberId, recipientMemberId, memberAId, memberBId, status, createdAt, profile]
      properties:
        id: { type: string }
        requesterMemberId: { type: string }
        recipientMemberId: { type: string }
        memberAId: { type: string }
        memberBId: { type: string }
        status: { type: string, enum: [pending, declined] }
        createdAt: { type: string, format: date-time }
        profile: { $ref: "#/components/schemas/RelationshipProfile" }
    FriendRequestLists:
      type: object
      required: [incoming, outgoing, nextCursor]
      properties:
        incoming: { type: array, items: { $ref: "#/components/schemas/FriendRequestItem" } }
        outgoing: { type: array, items: { $ref: "#/components/schemas/FriendRequestItem" } }
        nextCursor: { type: ["string", "null"] }
    SearchItem:
      type: object
      required: [memberId, profile, relationship, request, pendingRequestId, isFollowing]
      properties:
        memberId: { type: string }
        profile: { $ref: "#/components/schemas/Profile" }
        relationship: { type: string, enum: [none, friends] }
        request: { type: string, enum: [none, incoming, outgoing] }
        pendingRequestId: { type: ["string", "null"] }
        isFollowing: { type: boolean }
    SearchResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SearchItem" } }
        nextCursor: { type: ["string", "null"] }
    Suggestion:
      type: object
      required: [memberId, preferredName, explanation]
      properties:
        memberId: { type: string }
        preferredName: { type: string }
        explanation: { type: string }
    PaginatedFriends:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FriendListItem" } }
        nextCursor: { type: ["string", "null"] }
    PaginatedFollows:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FollowListItem" } }
        nextCursor: { type: ["string", "null"] }
    SafetyRelationshipInput:
      type: object
      required: [targetMemberId]
      properties: { targetMemberId: { type: string } }
    SafetyRelationship:
      type: object
      required: [id, actorMemberId, targetMemberId, kind, createdAt]
      properties:
        id: { type: string }
        actorMemberId: { type: string }
        targetMemberId: { type: string }
        kind: { type: string, enum: [block, mute, restrict] }
        createdAt: { type: string, format: date-time }
    ReportInput:
      type: object
      required: [category]
      properties:
        targetMemberId: { type: string }
        contentId: { type: string }
        contentTargetType: { type: string, enum: [post, comment] }
        contentTargetId: { type: string }
        category: { type: string, enum: [harassment, threats, exploitation, scams, impersonation, hateful_content, dangerous_medical_claims, distress_disclosure, respectful_disagreement] }
        details: { type: string, maxLength: 5000 }
    AppealInput:
      type: object
      required: [moderationRecordId, statement]
      properties: { moderationRecordId: { type: string }, statement: { type: string, minLength: 1, maxLength: 5000 } }
    ModerationDecisionInput:
      type: object
      required: [state, reason]
      properties:
        state: { type: string, enum: [allowed, held, removed] }
        decision: { type: string }
        sanction: { type: string, enum: [warning, content_removal, temporary_restriction, suspension, permanent_removal] }
        reason: { type: string, minLength: 1 }
    ModerationRecord:
      type: object
      required: [id, state, createdAt]
      properties:
        id: { type: string }
        reportId: { type: ["string", "null"] }
        contentId: { type: ["string", "null"] }
        subjectMemberId: { type: ["string", "null"] }
        state: { type: string, enum: [pending, allowed, held, removed, appealed] }
        decision: { type: ["string", "null"] }
        sanction: { type: ["string", "null"] }
        reason: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    Report:
      type: object
      required: [id, reporterMemberId, category, status, createdAt]
      properties:
        id: { type: string }
        reporterMemberId: { type: string }
        targetMemberId: { type: ["string", "null"] }
        contentId: { type: ["string", "null"] }
        category: { type: string }
        details: { type: ["string", "null"] }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    ReportCreateResponse:
      type: object
      required: [report, moderationRecord]
      properties:
        report: { $ref: "#/components/schemas/Report" }
        moderationRecord: { $ref: "#/components/schemas/ModerationRecord" }
    ReportHistoryItem:
      type: object
      required: [report, moderationRecord]
      properties:
        report: { $ref: "#/components/schemas/Report" }
        moderationRecord: { $ref: "#/components/schemas/ModerationRecord" }
    QueueItem:
      type: object
      required: [reportId, category, reportStatus, reportCreatedAt, moderationRecordId, moderationState]
      properties:
        reportId: { type: string }
        category: { type: string }
        reportStatus: { type: string }
        reportCreatedAt: { type: string, format: date-time }
        moderationRecordId: { type: string }
        moderationState: { type: string, enum: [pending, allowed, held, removed, appealed] }
    Appeal:
      type: object
      required: [id, moderationRecordId, appellantMemberId, statement, status, createdAt]
      properties:
        id: { type: string }
        moderationRecordId: { type: string }
        appellantMemberId: { type: string }
        statement: { type: string }
        status: { type: string, enum: [pending, allowed, removed] }
        createdAt: { type: string, format: date-time }
    AppealReviewInput:
      type: object
      required: [status, reason]
      # A non-empty reason is required for the immutable review audit.
      properties:
        status: { type: string, enum: [allowed, removed] }
        reason: { type: string, minLength: 1 }
    SupportContact:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    EvidenceAccessInput:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 1000 } }
    EvidenceAccessResponse:
      type: object
      required: [allowed, report]
      properties:
        allowed: { type: boolean }
        report: { $ref: "#/components/schemas/Report" }
    StaffCapabilitySummary:
      type: object
      required: [enabled, message]
      properties:
        enabled: { type: boolean }
        message: { type: string }
    StaffCapabilities:
      type: object
      required: [role, capabilities, tools]
      properties:
        role: { type: string, enum: [administrator, moderator, education_editor] }
        capabilities: { type: array, items: { type: string } }
        tools:
          type: array
          items:
            type: object
            required: [capability, enabled]
            properties:
              capability: { type: string }
              enabled: { type: boolean }
    VerificationRequest:
      type: object
      required: [id, memberId, scope, status, createdAt]
      properties:
        id: { type: string }
        memberId: { type: string }
        scope: { type: string }
        evidence: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OnboardingInput:
      type: object
      required: [ageEligible, ageEligibilityMethod, agePolicyVersion, acceptedDocuments]
      properties:
        ageEligible: { type: boolean }
        ageEligibilityMethod: { type: string, minLength: 1 }
        agePolicyVersion: { type: string, minLength: 1 }
        acceptedDocuments:
          type: array
          minItems: 3
          items:
            type: object
            required: [document, version]
            properties:
              document: { type: string, enum: [terms, privacy, community_guidelines] }
              version: { type: string, minLength: 1 }
    AccountSummary:
      type: object
      required: [memberId, emailVerified, ageEligible, acceptedDocuments]
      properties:
        memberId: { type: string }
        emailVerified: { type: boolean }
        ageEligible: { type: ["boolean", "null"] }
        acceptedDocuments:
          type: array
          items: { type: string }
    AccountSession:
      type: object
      required: [id, status, isCurrent]
      properties:
        id: { type: string }
        status: { type: string }
        isCurrent: { type: boolean }
        lastActiveAt: { type: ["string", "null"], format: date-time }
        deviceName: { type: ["string", "null"] }
    DeletionInput:
      type: object
    DeletionStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [none, pending, cancelled] }
        requestedAt: { type: ["string", "null"], format: date-time }
    Profile:
      type: object
      required: [id, preferredName]
      properties:
        id: { type: string }
        memberId: { type: ["string", "null"] }
        preferredName: { type: string }
        photoPath: { type: ["string", "null"] }
        biography: { type: ["string", "null"] }
        language: { type: ["string", "null"] }
        broadRegion: { type: ["string", "null"] }
        interests: { type: array, items: { type: string } }
        dementiaConnection: { type: ["string", "null"] }
        roles: { type: array, items: { type: string } }
        discoverable: { type: ["boolean", "null"] }
        visibility: { type: object, additionalProperties: { type: string, enum: [private, connections, members] } }
    ProfileInput:
      type: object
      required: [preferredName]
      properties:
        preferredName: { type: string, minLength: 1 }
        photoPath: { type: ["string", "null"] }
        biography: { type: ["string", "null"] }
        language: { type: ["string", "null"] }
        broadRegion: { type: ["string", "null"] }
        interests: { type: array, items: { type: string } }
        dementiaConnection: { type: ["string", "null"] }
        roles: { type: array, items: { type: string } }
        discoverable: { type: boolean }
        visibility: { type: object, additionalProperties: { type: string, enum: [private, connections, members] } }
    PrivacySettings:
      type: object
      properties:
        discoverable: { type: boolean }
        visibility: { type: object, additionalProperties: { type: string, enum: [private, connections, members] } }
    ThisIsMeCard:
      type: object
      required: [id, kind, text, position]
