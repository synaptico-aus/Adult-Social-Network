components:
  securitySchemes:
    clerk:
      type: http
      scheme: bearer
  schemas:
    ResourceInput:
      type: object
      additionalProperties: false
      required: [url, title, category, region, preview, previewPermission, embedAuthorized]
      properties:
        url: { type: string, maxLength: 2048 }
        title: { type: string, minLength: 1, maxLength: 200 }
        category:
          type: string
          enum: [article, news, podcast, music, video, event, helpline, research, organisation]
        region: { type: string, minLength: 1, maxLength: 100 }
        sourceDate: { type: [string, "null"], format: date-time }
        preview: { type: string, maxLength: 300, description: Original summary or explicitly permitted short preview only }
        previewPermission: { type: string, maxLength: 500, description: Required permission or original-summary provenance when preview is nonempty }
        embedAuthorized: { type: boolean, description: Staff confirms provider authorises embedding; only recognised YouTube and Spotify URLs supported }
    Resource:
      type: object
      required: [id, url, domain, title, category, region, sourceDate, preview, previewPermission, embedAuthorized, embedUrl, status, reviewedBy, reviewedAt, lastCheckedAt, linkState, stale, removalReason]
      properties:
        id: { type: string }
        url: { type: string }
        domain: { type: string }
        title: { type: string }
        category: { type: string }
        region: { type: string }
        sourceDate: { type: [string, "null"], format: date-time }
        preview: { type: string }
        previewPermission: { type: string }
        embedAuthorized: { type: boolean }
        embedUrl: { type: [string, "null"] }
        status: { type: string, enum: [draft, reviewed, removed] }
        reviewedBy: { type: [string, "null"] }
        reviewedAt: { type: [string, "null"], format: date-time }
        lastCheckedAt: { type: [string, "null"], format: date-time }
        linkState: { type: string, enum: [unchecked, reachable, unavailable, redirected] }
        stale: { type: boolean }
        removalReason: { type: [string, "null"] }
    ResourceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Resource" } }
    ResourceUrl:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, maxLength: 2048 }
    ResourcePreview:
      type: object
      required: [url, domain, title, description, sourceDate]
      properties:
        url: { type: string }
        domain: { type: string }
        title: { type: string }
        description: { type: string, description: Plain metadata suggestion; not automatically published or licensed }
        sourceDate: { type: [string, "null"], format: date-time }
    ResourceReason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ResourceReview:
      type: object
      additionalProperties: false
      required: [reviewerName, note, rightsConfirmed]
      properties:
        reviewerName: { type: string, minLength: 1, maxLength: 100, description: Public reviewer attribution; authenticated actor separately recorded }
        note: { type: string, minLength: 1, maxLength: 1000 }
        rightsConfirmed: { type: boolean, const: true }
    ResourceReport:
      type: object
      required: [id, resourceId, reason, status, resolution, createdAt]
      properties:
        id: { type: string }
        resourceId: { type: string }
        reason: { type: string }
        status: { type: string, enum: [open, resolved] }
        resolution: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    ResourceReportList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ResourceReport" } }
    MediaUploadInput:
      type: object
      required: [kind, contentType, size, clientIdempotencyKey]
      properties:
        kind: { type: string, enum: [photo, audio, video] }
        contentType: { type: string }
        size: { type: integer, minimum: 1 }
        clientIdempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        altText: { type: string, minLength: 1, maxLength: 1000 }
        videoFormat: { type: string, enum: [reel, post] }
    MediaUploadSession:
      type: object
      required: [asset, uploadURL]
      properties:
        asset: { $ref: "#/components/schemas/MediaAttachment" }
        uploadURL: { type: ["string", "null"], format: uri }
    MediaTranscriptInput:
      type: object
      required: [transcript]
      properties: { transcript: { type: string, minLength: 1, maxLength: 100000 } }
    WelcomeAvailabilityText:
      type: string
      enum:
        - "Welcome requests are open when a trained host is available."
        - "Trained hosts are limited; response timing is not provided."
        - "No trained active welcome host is currently available."
    GroupInput:
      type: object
      required: [name, category]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: ["string", "null"] }
        category: { type: string }
        rules: { type: ["string", "null"] }
        suggestionTags: { type: array, items: { type: string } }
        discoverability: { type: string, enum: [public, private] }
        contentVisibility: { type: string, enum: [public, members] }
        joinPolicy: { type: string, enum: [open, approval, closed] }
        welcomeEnabled: { type: boolean }
        welcomeAvailabilityText:
          oneOf:
            - { $ref: "#/components/schemas/WelcomeAvailabilityText" }
            - { type: "null" }
    Group:
      type: object
