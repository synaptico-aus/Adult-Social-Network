openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Authenticated account lifecycle
  - name: safety
    description: Member safety and reporting
  - name: staff
    description: Capability-scoped moderation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /account/onboarding:
    post:
      operationId: completeOnboarding
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummary"
        "400": { description: Invalid or ineligible onboarding }
        "401": { description: Unauthorized }
  /account:
    get:
      operationId: getAccountSummary
      tags: [account]
      responses:
        "200":
          description: Account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummary"
        "401": { description: Unauthorized }
  /account/sessions:
    get:
      operationId: listAccountSessions
      tags: [account]
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountSession" }
        "401": { description: Unauthorized }
  /account/sessions/{sessionId}:
    delete:
      operationId: revokeAccountSession
      tags: [account]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        "401": { description: Unauthorized }
        "403": { description: Not owned by current member }
  /account/sessions/others:
    delete:
      operationId: revokeOtherAccountSessions
      tags: [account]
      responses:
        "204": { description: Revoked }
        "401": { description: Unauthorized }
  /account/deletion:
    get:
      operationId: getDeletionStatus
      tags: [account]
      responses:
        "200":
          description: Deletion status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionStatus" }
        "401": { description: Unauthorized }
    post:
      operationId: initiateDeletion
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeletionInput" }
      responses:
        "202":
          description: Pending manual/worker processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionStatus" }
        "401": { description: Unauthorized }
        "403": { description: Fresh Clerk reauthentication required }
    delete:
      operationId: cancelDeletion
      tags: [account]
      responses:
        "204": { description: Cancelled }
        "401": { description: Unauthorized }
  /profile:
    get:
      operationId: getOwnProfile
      tags: [profile]
      responses:
        "200": { description: Own profile, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
    put:
      operationId: updateOwnProfile
      tags: [profile]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfileInput" } } }
      responses:
        "200": { description: Updated profile, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
  /profile/view-as-member:
    get:
      operationId: previewProfileAsMember
      tags: [profile]
      responses:
        "200": { description: Visibility-filtered preview, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
  /privacy:
    patch:
      operationId: updatePrivacySettings
      tags: [privacy]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PrivacySettings" } } }
      responses:
        "200": { description: Privacy settings }
  /this-is-me:
    get:
      operationId: listThisIsMeCards
      tags: [profile]
      responses:
        "200": { description: Cards, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ThisIsMeCard" } } } } }
    post:
      operationId: createThisIsMeCard
      tags: [profile]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ThisIsMeCardInput" } } }
      responses:
        "201": { description: Created card, content: { application/json: { schema: { $ref: "#/components/schemas/ThisIsMeCard" } } } }
  /this-is-me/{id}:
    patch:
      operationId: updateThisIsMeCard
      tags: [profile]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ThisIsMeCardUpdate" } } }
      responses: { "200": { description: Updated card } }
    delete:
      operationId: deleteThisIsMeCard
      tags: [profile]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted } }
  /verification:
    get:
      operationId: getOwnVerificationRequests
      tags: [verification]
      responses: { "200": { description: Verification requests } }
    post:
      operationId: submitVerificationRequest
      tags: [verification]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VerificationRequestInput" } } }
      responses: { "201": { description: Submitted } }
  /consent:
    get:
      operationId: getConsentHistory
      tags: [consent]
      responses: { "200": { description: Append-only consent history } }
  /profile/export:
    get:
      operationId: exportOwnProfile
      tags: [profile]
      responses: { "200": { description: Authenticated JSON export } }
  /profile/photo/upload-url:
    post:
      operationId: requestProfilePhotoUpload
      tags: [profile]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePhotoUploadInput" } } }
      responses: { "200": { description: Private upload URL, content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePhotoUpload" } } } } }
  /profile/photo/{memberId}/{photoId}:
    get:
      operationId: serveProfilePhoto
      tags: [profile]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string } }
        - { name: photoId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Private image bytes } }
  /staff/verification-requests:
    get:
      operationId: listVerificationRequestsForStaff
      tags: [verification]
      responses: { "200": { description: Staff-only verification queue, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/VerificationRequest" } } } } } }
  /staff/verification-requests/{id}:
    patch:
      operationId: reviewVerificationRequest
      tags: [verification]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VerificationReviewInput" } } }
      responses: { "200": { description: Reviewed request, content: { application/json: { schema: { $ref: "#/components/schemas/VerificationRequest" } } } } }
  /staff/tools:
    get:
      operationId: getStaffCapabilitySummary
      tags: [staff]
      responses: { "200": { description: Staff capability summary, content: { application/json: { schema: { $ref: "#/components/schemas/StaffCapabilitySummary" } } } } }
  /staff/capabilities:
    get:
      operationId: getStaffCapabilities
      tags: [staff]
      responses:
        "200":
          description: Server-authorized staff capabilities and tools
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffCapabilities" } } }
        "401": { description: Unauthorized }
        "403": { description: Active staff assignment required }
  /safety/{kind}:
    post:
      operationId: createSafetyRelationship
      tags: [safety]
      parameters: [{ name: kind, in: path, required: true, schema: { type: string, enum: [block, mute, restrict] } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SafetyRelationshipInput" } } }
      responses: { "201": { description: Relationship created, content: { application/json: { schema: { $ref: "#/components/schemas/SafetyRelationship" } } } }, "401": { description: Unauthorized } }
  /safety/{kind}/{targetMemberId}:
    delete:
      operationId: deleteSafetyRelationship
      tags: [safety]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [block, mute, restrict] } }
        - { name: targetMemberId, in: path, required: true, schema: { type: string } }
      responses: { "204": { description: Removed }, "401": { description: Unauthorized } }
  /safety/relationships:
    get:
      operationId: listOwnSafetyRelationships
      tags: [safety]
      responses:
        "200":
          description: Safety relationships owned by the signed-in member
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SafetyRelationship" } } } }
        "401": { description: Unauthorized }
  /reports:
    get:
      operationId: listOwnReports
      tags: [safety]
      responses: { "200": { description: Own report history, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ReportHistoryItem" } } } } } }
    post:
      operationId: createReport
      tags: [safety]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReportInput" } } }
      responses: { "201": { description: Report created, content: { application/json: { schema: { $ref: "#/components/schemas/ReportCreateResponse" } } } } }
  /appeals:
    get:
      operationId: listOwnAppeals
      tags: [safety]
      responses: { "200": { description: Own appeals, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Appeal" } } } } } }
    post:
      operationId: createAppeal
      tags: [safety]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AppealInput" } } }
      responses: { "201": { description: Appeal created, content: { application/json: { schema: { $ref: "#/components/schemas/Appeal" } } } } }
  /support-contact:
    get:
      operationId: getSupportContact
      tags: [safety]
      responses: { "200": { description: Published support contact, content: { application/json: { schema: { $ref: "#/components/schemas/SupportContact" } } } }, "503": { description: Not configured } }
  /staff/moderation/queue:
    get:
      operationId: getModerationQueue
      tags: [staff]
      responses: { "200": { description: Capability-scoped moderation queue, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/QueueItem" } } } } } }
  /staff/moderation/urgent:
    get:
      operationId: getUrgentModerationQueue
      tags: [staff]
      responses: { "200": { description: Urgent queue, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/QueueItem" } } } } } }
  /staff/evidence/{evidenceId}/access:
    post:
      operationId: accessReportedEvidence
      tags: [staff]
      parameters: [{ name: evidenceId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceAccessInput" } } } }
      responses: { "200": { description: Scoped reported evidence, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceAccessResponse" } } } } }
  /staff/moderation/{id}/decision:
    post:
      operationId: decideModeration
      tags: [staff]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModerationDecisionInput" } } }
      responses: { "200": { description: Moderation decision, content: { application/json: { schema: { $ref: "#/components/schemas/ModerationRecord" } } } } }
  /staff/appeals:
    get:
      operationId: listStaffAppeals
      tags: [staff]
      responses: { "200": { description: Pending appeals, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Appeal" } } } } } }
  /staff/appeals/{id}:
    patch:
      operationId: reviewStaffAppeal
      tags: [staff]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AppealReviewInput" } } } }
      responses: { "200": { description: Reviewed appeal, content: { application/json: { schema: { $ref: "#/components/schemas/Appeal" } } } } }
  /friends/requests:
    get:
      operationId: listFriendRequests
      tags: [friends]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
      responses: { "200": { description: Incoming and outgoing requests, content: { application/json: { schema: { $ref: "#/components/schemas/FriendRequestLists" } } } } }
    post:
      operationId: sendFriendRequest
      tags: [friends]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MemberTargetInput" } } } }
      responses: { "201": { description: Request created, content: { application/json: { schema: { $ref: "#/components/schemas/FriendRequestMutationResponse" } } } }, "200": { description: Existing reciprocal request, content: { application/json: { schema: { $ref: "#/components/schemas/FriendRequestMutationResponse" } } } } }
  /friends/requests/{requestId}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Friendship } }
  /friends/requests/{requestId}/decline:
    post:
      operationId: declineFriendRequest
      tags: [friends]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Declined } }
  /friends/requests/{requestId}:
    delete:
      operationId: cancelFriendRequest
      tags: [friends]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Cancelled } }
  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
      responses: { "200": { description: Friendships, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedFriends" } } } } }
  /friends/{memberId}:
    delete:
      operationId: unfriend
      tags: [friends]
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Removed } }
  /follows/{memberId}:
    post:
      operationId: followMember
      tags: [follows]
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      responses: { "201": { description: Follow created } }
    delete:
      operationId: unfollowMember
      tags: [follows]
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Removed } }
  /follows:
    get:
      operationId: listFollows
      tags: [follows]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
      responses: { "200": { description: Follows, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedFollows" } } } } }
  /search:
    get:
      operationId: searchProfiles
      tags: [discovery]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses: { "200": { description: Discoverable profiles, content: { application/json: { schema: { $ref: "#/components/schemas/SearchResponse" } } } } }
  /discovery/suggestions:
    get:
      operationId: listSuggestions
      tags: [discovery]
      responses: { "200": { description: Explicitly opted-in suggestions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Suggestion" } } } } } }
  /discovery/suggestions/{memberId}/hide:
    post:
      operationId: hideSuggestion
      tags: [discovery]
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Hidden } }
  /account/settings:
    get:
      operationId: getAccountSettings
      tags: [account]
      responses: { "200": { description: Relationship and discovery settings, content: { application/json: { schema: { $ref: "#/components/schemas/AccountSettings" } } } } }
    patch:
      operationId: updateAccountSettings
      tags: [account]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AccountSettingsInput" } } } }
      responses: { "200": { description: Updated settings, content: { application/json: { schema: { $ref: "#/components/schemas/AccountSettings" } } } } }
components:
  schemas:
    MemberTargetInput:
      type: object
      required: [targetMemberId]
      properties: { targetMemberId: { type: string, minLength: 1 } }
    Relationship:
      type: object
      properties: { id: { type: string }, createdAt: { type: string, format: date-time } }
    AccountSettingsInput:
      type: object
      properties:
        inboundFriendRequests: { type: boolean }
        inboundFollows: { type: boolean }
        suggestionsEnabled: { type: boolean }
    AccountSettings:
      type: object
      required: [memberId, inboundFriendRequests, inboundFollows, suggestionsEnabled]
      properties:
        memberId: { type: string }
        inboundFriendRequests: { type: boolean }
        inboundFollows: { type: boolean }
        suggestionsEnabled: { type: boolean }
    RelationshipProfile:
      type: object
      required: [id, preferredName]
      properties: { id: { type: string }, preferredName: { type: string } }
    FriendListItem:
      type: object
      required: [id, memberId, preferredName, direction, status, createdAt]
      properties:
        id: { type: string }
        memberId: { type: string }
        preferredName: { type: string }
        direction: { type: string, enum: [mutual] }
        status: { type: string, enum: [friends] }
        createdAt: { type: string, format: date-time }
    FollowListItem:
      type: object
      required: [id, memberId, preferredName, direction, status, createdAt]
      properties:
        id: { type: string }
        memberId: { type: string }
        preferredName: { type: string }
        direction: { type: string, enum: [incoming, outgoing] }
        status: { type: string, enum: [following] }
        createdAt: { type: string, format: date-time }
    FriendRequestMutationResponse:
      type: object
      required: [status, request]
      properties:
        status: { type: string, enum: [created, incoming_request] }
        request: { $ref: "#/components/schemas/FriendRequest" }
    FriendRequest:
      type: object
      required: [id, requesterMemberId, recipientMemberId, memberAId, memberBId, status, createdAt]
      properties:
        id: { type: string }
        requesterMemberId: { type: string }
        recipientMemberId: { type: string }
        memberAId: { type: string }
        memberBId: { type: string }
        status: { type: string, enum: [pending, declined] }
        createdAt: { type: string, format: date-time }
    FriendRequestItem:
      type: object
      required: [id, requesterMemberId, recipientMemberId, memberAId, memberBId, status, createdAt, profile]
      properties:
        id: { type: string }
        requesterMemberId: { type: string }
        recipientMemberId: { type: string }
        memberAId: { type: string }
        memberBId: { type: string }
        status: { type: string, enum: [pending, declined] }
        createdAt: { type: string, format: date-time }
        profile: { $ref: "#/components/schemas/RelationshipProfile" }
    FriendRequestLists:
      type: object
      required: [incoming, outgoing, nextCursor]
      properties:
        incoming: { type: array, items: { $ref: "#/components/schemas/FriendRequestItem" } }
        outgoing: { type: array, items: { $ref: "#/components/schemas/FriendRequestItem" } }
        nextCursor: { type: ["string", "null"] }
    SearchItem:
      type: object
      required: [memberId, profile, relationship, request, pendingRequestId, isFollowing]
      properties:
        memberId: { type: string }
        profile: { $ref: "#/components/schemas/Profile" }
        relationship: { type: string, enum: [none, friends] }
        request: { type: string, enum: [none, incoming, outgoing] }
        pendingRequestId: { type: ["string", "null"] }
        isFollowing: { type: boolean }
    SearchResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SearchItem" } }
        nextCursor: { type: ["string", "null"] }
    Suggestion:
      type: object
      required: [memberId, preferredName, explanation]
      properties:
        memberId: { type: string }
        preferredName: { type: string }
        explanation: { type: string }
    PaginatedFriends:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FriendListItem" } }
        nextCursor: { type: ["string", "null"] }
    PaginatedFollows:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FollowListItem" } }
        nextCursor: { type: ["string", "null"] }
    SafetyRelationshipInput:
      type: object
      required: [targetMemberId]
      properties: { targetMemberId: { type: string } }
    SafetyRelationship:
      type: object
      required: [id, actorMemberId, targetMemberId, kind, createdAt]
      properties:
        id: { type: string }
        actorMemberId: { type: string }
        targetMemberId: { type: string }
        kind: { type: string, enum: [block, mute, restrict] }
        createdAt: { type: string, format: date-time }
    ReportInput:
      type: object
      required: [category]
      properties:
        targetMemberId: { type: string }
        contentId: { type: string }
        category: { type: string, enum: [harassment, threats, exploitation, scams, impersonation, hateful_content, dangerous_medical_claims, distress_disclosure, respectful_disagreement] }
        details: { type: string, maxLength: 5000 }
    AppealInput:
      type: object
      required: [moderationRecordId, statement]
      properties: { moderationRecordId: { type: string }, statement: { type: string, minLength: 1, maxLength: 5000 } }
    ModerationDecisionInput:
      type: object
      required: [state, reason]
      properties:
        state: { type: string, enum: [allowed, held, removed] }
        decision: { type: string }
        sanction: { type: string, enum: [warning, content_removal, temporary_restriction, suspension, permanent_removal] }
        reason: { type: string, minLength: 1 }
    ModerationRecord:
      type: object
      required: [id, state, createdAt]
      properties:
        id: { type: string }
        reportId: { type: ["string", "null"] }
        contentId: { type: ["string", "null"] }
        subjectMemberId: { type: ["string", "null"] }
        state: { type: string, enum: [pending, allowed, held, removed, appealed] }
        decision: { type: ["string", "null"] }
        sanction: { type: ["string", "null"] }
        reason: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    Report:
      type: object
      required: [id, reporterMemberId, category, status, createdAt]
      properties:
        id: { type: string }
        reporterMemberId: { type: string }
        targetMemberId: { type: ["string", "null"] }
        contentId: { type: ["string", "null"] }
        category: { type: string }
        details: { type: ["string", "null"] }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    ReportCreateResponse:
      type: object
      required: [report, moderationRecord]
      properties:
        report: { $ref: "#/components/schemas/Report" }
        moderationRecord: { $ref: "#/components/schemas/ModerationRecord" }
    ReportHistoryItem:
      type: object
      required: [report, moderationRecord]
      properties:
        report: { $ref: "#/components/schemas/Report" }
        moderationRecord: { $ref: "#/components/schemas/ModerationRecord" }
    QueueItem:
      type: object
      required: [reportId, category, reportStatus, reportCreatedAt, moderationRecordId, moderationState]
      properties:
        reportId: { type: string }
        category: { type: string }
        reportStatus: { type: string }
        reportCreatedAt: { type: string, format: date-time }
        moderationRecordId: { type: string }
        moderationState: { type: string, enum: [pending, allowed, held, removed, appealed] }
    Appeal:
      type: object
      required: [id, moderationRecordId, appellantMemberId, statement, status, createdAt]
      properties:
        id: { type: string }
        moderationRecordId: { type: string }
        appellantMemberId: { type: string }
        statement: { type: string }
        status: { type: string, enum: [pending, allowed, removed] }
        createdAt: { type: string, format: date-time }
    AppealReviewInput:
      type: object
      required: [status, reason]
      # A non-empty reason is required for the immutable review audit.
      properties:
        status: { type: string, enum: [allowed, removed] }
        reason: { type: string, minLength: 1 }
    SupportContact:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    EvidenceAccessInput:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 1000 } }
    EvidenceAccessResponse:
      type: object
      required: [allowed, report]
      properties:
        allowed: { type: boolean }
        report: { $ref: "#/components/schemas/Report" }
    StaffCapabilitySummary:
      type: object
      required: [enabled, message]
      properties:
        enabled: { type: boolean }
        message: { type: string }
    StaffCapabilities:
      type: object
      required: [role, capabilities, tools]
      properties:
        role: { type: string, enum: [administrator, moderator, education_editor] }
        capabilities: { type: array, items: { type: string } }
        tools:
          type: array
          items:
            type: object
            required: [capability, enabled]
            properties:
              capability: { type: string }
              enabled: { type: boolean }
    VerificationRequest:
      type: object
      required: [id, memberId, scope, status, createdAt]
      properties:
        id: { type: string }
        memberId: { type: string }
        scope: { type: string }
        evidence: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OnboardingInput:
      type: object
      required: [ageEligible, ageEligibilityMethod, agePolicyVersion, acceptedDocuments]
      properties:
        ageEligible: { type: boolean }
        ageEligibilityMethod: { type: string, minLength: 1 }
        agePolicyVersion: { type: string, minLength: 1 }
        acceptedDocuments:
          type: array
          minItems: 3
          items:
            type: object
            required: [document, version]
            properties:
              document: { type: string, enum: [terms, privacy, community_guidelines] }
              version: { type: string, minLength: 1 }
    AccountSummary:
      type: object
      required: [memberId, emailVerified, ageEligible, acceptedDocuments]
      properties:
        memberId: { type: string }
        emailVerified: { type: boolean }
        ageEligible: { type: ["boolean", "null"] }
        acceptedDocuments:
          type: array
          items: { type: string }
    AccountSession:
      type: object
      required: [id, status, isCurrent]
      properties:
        id: { type: string }
        status: { type: string }
        isCurrent: { type: boolean }
        lastActiveAt: { type: ["string", "null"], format: date-time }
        deviceName: { type: ["string", "null"] }
    DeletionInput:
      type: object
    DeletionStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [none, pending, cancelled] }
        requestedAt: { type: ["string", "null"], format: date-time }
    Profile:
      type: object
      required: [id, preferredName]
      properties:
        id: { type: string }
        memberId: { type: ["string", "null"] }
        preferredName: { type: string }
        photoPath: { type: ["string", "null"] }
        biography: { type: ["string", "null"] }
        language: { type: ["string", "null"] }
        broadRegion: { type: ["string", "null"] }
        interests: { type: array, items: { type: string } }
        dementiaConnection: { type: ["string", "null"] }
        roles: { type: array, items: { type: string } }
        discoverable: { type: ["boolean", "null"] }
        visibility: { type: object, additionalProperties: { type: string, enum: [private, connections, members] } }
    ProfileInput:
      type: object
      required: [preferredName]
      properties:
        preferredName: { type: string, minLength: 1 }
        photoPath: { type: ["string", "null"] }
        biography: { type: ["string", "null"] }
        language: { type: ["string", "null"] }
        broadRegion: { type: ["string", "null"] }
        interests: { type: array, items: { type: string } }
        dementiaConnection: { type: ["string", "null"] }
        roles: { type: array, items: { type: string } }
        discoverable: { type: boolean }
        visibility: { type: object, additionalProperties: { type: string, enum: [private, connections, members] } }
    PrivacySettings:
      type: object
      properties:
        discoverable: { type: boolean }
        visibility: { type: object, additionalProperties: { type: string, enum: [private, connections, members] } }
    ThisIsMeCard:
      type: object
      required: [id, kind, text, position]
      properties:
        id: { type: string }
        kind: { type: string, enum: [things_i_enjoy, music_i_love, experiences_i_want_to_share, how_i_like_to_communicate] }
        text: { type: string }
        position: { type: integer }
        permissionAcknowledged: { type: boolean }
    ThisIsMeCardInput:
      type: object
      required: [kind, text]
      properties:
        kind: { type: string, enum: [things_i_enjoy, music_i_love, experiences_i_want_to_share, how_i_like_to_communicate] }
        text: { type: string }
        permissionAcknowledged: { type: boolean }
    ThisIsMeCardUpdate:
      type: object
      properties:
        text: { type: string }
        permissionAcknowledged: { type: boolean }
    VerificationRequestInput:
      type: object
      required: [scope]
      properties:
        scope: { type: string }
        evidence: { type: string }
        notes: { type: string }
    VerificationReviewInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, rejected] }
    ProfilePhotoUploadInput:
      type: object
      required: [contentType, size]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
    ProfilePhotoUpload:
      type: object
      required: [uploadURL, objectPath, reminder]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        reminder: { type: string }

